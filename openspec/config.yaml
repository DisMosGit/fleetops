schema: spec-driven

# Project context (optional)
# Shown to the AI when creating artifacts, and as an input to apply and
# archive. A pointer, not a copy -- the rules live in the files named here,
# and restating them would let this block drift from them.

context: |
  FleetOps -- a control plane and device-fleet simulator for over-the-air
  firmware updates. Go (module github.com/DisMosGit/fleetops), Temporal,
  gRPC/Protobuf, MongoDB, RabbitMQ, React + Vite, Docker + k3d. Delivery is
  staged; the stage table in README.md gates what may land when.

  Authoritative sources, none duplicated here:
  - AGENTS.md -- the engineering rules, golden rules through the
    four-command Definition of Done
  - CONTRIBUTING.md -- setup, PR workflow, review expectations
  - README.md -- the stage table and the repository map
  - docs/README.md -- the documentation backlog, one document per trigger
    milestone
  - Makefile -- every gate and codegen target, by name
  - .agents/skills/commit/SKILL.md -- the dependency ladder commits follow
    and the one scope list
  - openspec/specs/ -- the durable capability baseline, flat kebab-case
    paths. Archiving a change merges its deltas into this tree, and the
    first archive of a capability creates its base spec. Read the current
    inventory with `openspec list --specs` and the unarchived work with
    `openspec list --changes`; this block carries no counts, because a
    count written here is stale as soon as it is read.

# Per-artifact rules (optional)
# Additive to the schema's built-in guidance, so each entry carries only
# what that guidance does NOT already say.
#
# Written without a colon inside each entry on purpose. A plain YAML scalar
# containing a colon followed by a space parses as a mapping, which silently
# drops the whole rules list for that artifact with a warning.

rules:
  proposal:
    - Name the delivery stage the change belongs to, or say why it lands
      outside the staged plan in README.md. Work that belongs to a stage
      that has not landed waits for it.
    - Name the capability paths under openspec/specs/ that the change adds
      or modifies. They are the contract the specs artifact has to fulfil,
      and an invented path targets a capability that does not exist.
    - An idea that is not yet a change belongs in a GitHub issue, not in
      openspec/changes/.

  specs:
    - A capability with no base spec takes an ADDED delta. A MODIFIED or
      REMOVED delta against a capability that has no base spec is refused
      at archive time, so a change that reshapes one records what it needs
      in the change that first introduces the capability.
    - A MODIFIED delta replaces the whole requirement block, so it must be
      a superset of the requirement it replaces -- a whole-file rewrite
      silently drops every scenario that landed in the base since the delta
      was written.
    - Keep the flat kebab-case layout under specs/. A capability directory
      holds spec.md and nothing else.

  tasks:
    - Name the artefact or command a task changes, never the behaviour
      alone, and name its verification as the command that proves it. A
      task whose verification says what it checks rather than what to run
      cannot be run.
    - Copy the verification command verbatim from the Makefile or AGENTS.md
      -- e.g. `make check` or `go test -race -count=1` -- rather than
      describing what the gate does.
    - A task group is one commit. Groups land in the dependency ladder
      order in .agents/skills/commit/SKILL.md, and a group carries the
      tests and documentation its own work calls for.
    - A task that cannot be finished yet says so in the task and names what
      unblocks it. An unfinished task is not a placeholder.

# Per-operation guidance (optional)
# Advisory, and shown alongside the project context as an apply or archive
# input.

operations:
  apply:
    guidance:
      - Run `openspec validate "<change>" --strict` before starting and
        whenever the artifacts change. CONTRIBUTING.md makes the plan the
        thing implementation is measured against.
      - Run `make check` once the work of each task group lands. It wraps
        the four Definition of Done commands from AGENTS.md and rewrites
        files through `goimports -w .`, so re-read `git status` afterwards.
      - Run the command a task names. Ticking a box without running its
        verification is the failure the verification column exists to
        prevent.

  archive:
    guidance:
      - Tick every box in tasks.md and pass
        `openspec validate "<change>" --strict` before archiving.
      - Archive in dependency order. The first archive of a capability
        creates its base spec under openspec/specs/, and a MODIFIED delta
        archived before that base exists is refused.

# FleetOps configuration — sample local-stack values (identical to the built-in defaults).
#
# Every binary takes this file via `-config <path>`; fields absent from the file keep the
# defaults shown here, and startup fails on unknown keys or invalid values. Addresses are
# host:port; URIs may carry credentials (they are never echoed in logs or probe responses).

simulation:
  # Simulated devices one agent emulator process runs.
  fleet_size: 100
  # Simulated duration of one firmware application (Go duration string).
  apply_delay: "1s"
  # Probability a simulated firmware application succeeds, in [0, 1].
  apply_success_rate: 1.0

grpc:
  # Control plane AgentService listen address.
  listen_addr: ":9090"
  # Control plane gRPC address the agent emulator connects to.
  control_plane_addr: "localhost:9090"

mongodb:
  # Connection URI (mongodb:// or mongodb+srv://).
  uri: "mongodb://localhost:27017"
  # Fleet database name.
  database: "fleetops"

liveness:
  # Silence after which a device is marked offline (Go duration string).
  offline_threshold: "30s"
  # How often the offline-staleness sweep runs (Go duration string).
  sweep_interval: "10s"

telemetry:
  # Heartbeat events per batched telemetry write.
  batch_size: 500
  # Longest time a heartbeat waits for its write batch (Go duration string).
  flush_interval: "1s"

snapshots:
  # Cadence of periodic device-workflow state snapshots (Go duration string).
  interval: "1m"

rabbitmq:
  # Connection URL (amqp:// or amqps://).
  url: "amqp://guest:guest@localhost:5672/"
  # Unacknowledged deliveries one consumer holds in flight.
  prefetch: 32
  # Events buffered for publication before load shedding drops them (counted, never blocking).
  publish_buffer: 1024
  # Processing attempts before a delivery is dead-lettered.
  max_attempts: 3
  # Backoff delay of the first retry attempt (Go duration string).
  retry_base: "5s"
  # Upper bound on a retry attempt's backoff delay; must not be below retry_base.
  retry_max: "1m"
  # Cadence of queue-depth sampling (Go duration string).
  queue_depth_interval: "15s"

alerting:
  # Health score below which a degraded heartbeat is recorded as an alert, in [0, 1].
  health_threshold: 0.6

rollout:
  # Width of the sliding window a wave's health is evaluated over (Go duration string). The
  # effective window never reaches back before the wave's start time.
  health_window: "5m"
  # Health score at or above which a heartbeat counts as a success. Deliberately separate from
  # alerting.health_threshold: alert sensitivity and the promote/rollback boundary are
  # different decisions, in [0, 1].
  sample_health_threshold: 0.6
  # Success ratio at or above which a decided window is healthy, in [0, 1]. A window at exactly
  # this ratio is healthy.
  min_success_ratio: 0.95
  # Samples a window must hold before its verdict is decided; below it the wave is undecided
  # rather than healthy, so thin evidence can never promote a wave.
  min_samples: 10
  # The canary sequence a rollout drives, in order. Each entry's `percent` is a cumulative share
  # of the rollout's eligible pool — a wave targets the devices its share adds beyond the shares
  # before it — and `require_approval` makes the wave wait for an operator's approve_next_wave
  # signal before it starts. Validation keeps the sequence honest: non-empty, every share in
  # (0, 100], strictly increasing, and the last entry at 100.
  waves:
    - percent: 1
      require_approval: false
    - percent: 5
      require_approval: false
    - percent: 25
      require_approval: true
    - percent: 100
      require_approval: true
  # Longest a wave may stay undecided before its gate treats it as unhealthy, measured from the
  # wave's start (Go duration string). Must not be shorter than health_window, which would decide
  # a wave before its first measurement could be taken.
  decision_timeout: "30m"

temporal:
  # Temporal frontend address.
  address: "localhost:7233"
  # Namespace hosting the FleetOps workflows.
  namespace: "default"
  # Task queue the workers poll.
  task_queue: "fleetops"

observability:
  # OTLP collector endpoint; empty disables trace export.
  otel_endpoint: "localhost:4317"
  # Prometheus metrics listen address.
  metrics_addr: ":9091"
  # Liveness/readiness (/healthz, /readyz) listen address of the control plane and the worker.
  health_addr: ":8081"
